<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Hybrid Training Center</title>
    <link rel="stylesheet" href="assets/css/styles.css">
</head>
<body>
    <main class="login-container">
        <div class="card">
            <!-- Logo Casco Espartano (Imagen del usuario recortada y centrada) -->
            <div style="width: 160px; height: 160px; margin: 0 auto 1rem; border-radius: 50%; overflow: hidden; position: relative; background-color: #000;">
                <img src="assets/img/logo.jpg" alt="Logo Hybrid Training Center" style="width: 100%; height: 100%; object-fit: cover; object-position: center 20%; transform: scale(1.4);">
            </div>
            <h2 class="text-center mb-1" style="color: var(--text-color); font-size: 1.25rem;">Hybrid Training Center</h2>
            <p class="text-center text-muted mb-4">Inicia sesión para continuar</p>
            
            <form id="loginForm">
                <div class="form-group">
                    <label for="email">Correo Electrónico</label>
                    <input type="email" id="email" required autocomplete="email">
                </div>
                
                <div class="form-group">
                    <label for="password">Contraseña</label>
                    <div class="password-container">
                        <input type="password" id="password" required autocomplete="current-password">
                        <button type="button" id="togglePassword" class="toggle-password" aria-label="Mostrar contraseña">
                            <svg id="eyeIcon" viewBox="0 0 24 24" width="20" height="20" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                                <circle cx="12" cy="12" r="3"></circle>
                            </svg>
                        </button>
                    </div>
                </div>
                
                <div id="loginError" class="error-message"></div>
                
                <button type="submit" class="btn mt-2" id="loginBtn">Entrar</button>
            </form>
        </div>
    </main>
    
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/supabaseClient.js"></script>
    <script src="js/auth.js"></script>
</body>
</html>
